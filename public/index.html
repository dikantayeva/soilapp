        <script>
function openLoginModal() {
    document.getElementById('login-modal').style.display = 'flex';
}

function closeLoginModal() {
    document.getElementById('login-modal').style.display = 'none';
    document.getElementById('login-error').innerText = '';
}

async function login() {
    const username = document.getElementById('username-input').value.trim();
    const password = document.getElementById('password-input').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            localStorage.setItem('currentUser', JSON.stringify({ username: data.username, role: data.role }));
            applyRolePermissions(data.role, data.username);
            closeLoginModal();
        } else {
            document.getElementById('login-error').innerText = data.message;
        }
    } catch (err) {
        console.error('Ошибка входа:', err);
        document.getElementById('login-error').innerText = 'Ошибка соединения с сервером';
    }
}

function logout() {
    localStorage.removeItem('currentUser');
    location.reload(); 
}

function applyRolePermissions(role, username) {
    document.getElementById('login-btn').style.display = 'none';
    
    const userInfo = document.getElementById('user-info');
    userInfo.style.display = 'inline-block';
    userInfo.innerText = `${username} (${role})`;
    
    document.getElementById('logout-btn').style.display = 'inline-block';

    // ВАЖНО: Принудительно делаем дашборд видимым
    const dashboard = document.getElementById('main-dashboard');
    if (dashboard) {
        dashboard.style.display = 'block';
    }

    // Исправление для корректной отрисовки карты Leaflet
    setTimeout(() => {
        if (typeof map !== 'undefined') {
            map.invalidateSize();
        }
    }, 200);

    if (role === 'user') {
        console.log('Режим просмотра (user)');
    } else if (role === 'engineer') {
        console.log('Режим инженера');
    } else if (role === 'admin') {
        console.log('Режим администратора');
    }
}

// Автопроверка сессии при перезагрузке страницы, если пользователь уже залогинен
window.addEventListener('DOMContentLoaded', () => {
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        const user = JSON.parse(savedUser);
        applyRolePermissions(user.role, user.username);
    }
});

<script>
async function loadSensorDataForObject(objectId) {
    currentSelectedObjectId = objectId; // запоминаем выбранный объект

    // Сразу убираем старый график, чтобы он не "залипал",
    // пока не пришёл ответ по новой дате
    if (ilChart) {
        ilChart.destroy();
        ilChart = null;
    }
    document.getElementById('chartTitle').innerText = `Объект: ${objectId} — загрузка...`;

    // 1. Берем значение из календаря
    const dateInput = document.getElementById('reading-date').value;
    console.log("Выбранная дата из инпута:", dateInput);

    // Форматируем для сервера: явно указываем 'Z' (UTC),
    // чтобы не зависеть от настроек таймзоны сессии на стороне БД
    const formattedDate = dateInput ? dateInput + ':00Z' : '';
    const url = `/api/object-details/${objectId}?date=${encodeURIComponent(formattedDate)}`;
    console.log("URL запроса к серверу:", url);

    try {
        const response = await fetch(url, { cache: 'no-store' });

        if (!response.ok) {
            throw new Error(`Сервер вернул ошибку: ${response.status}`);
        }

        const data = await response.json();
        console.log("Данные, полученные от сервера:", data);

        if (!data || data.length === 0) {
            // Данных за выбранную дату нет — график остаётся пустым
            document.getElementById('chartTitle').innerText = `Объект: ${objectId} — нет данных за выбранную дату`;
            return;
        }

        // Сохраняем профиль — понадобится для списка глубин в режиме "Тренд"
        lastProfileData = data;

        // Обновляем график в зависимости от текущего режима
        if (chartMode === 'trend') {
            populateDepthSelect(data);
            const selectedSensorId = document.getElementById('depth-select').value;
            loadSensorTrend(selectedSensorId);
        } else {
            updateChart(objectId, data);
        }
    } catch (err) {
        console.error('Ошибка при загрузке данных:', err);
        document.getElementById('chartTitle').innerText = `Объект: ${objectId} — ошибка загрузки данных`;
    }
}
// Переменная для хранения ID текущего выбранного объекта
let currentSelectedObjectId = null;

// Текущий режим графика: 'profile' (срез по глубине) или 'trend' (история по времени)
let chartMode = 'profile';

// Последние загруженные данные профиля — нужны, чтобы построить список глубин для тренда
let lastProfileData = [];

// Последние загруженные данные тренда — нужны для экспорта в CSV
let lastTrendData = [];
let lastTrendSensorId = null;

// Форматирует выбранную дату в формате, который понимает сервер (UTC, с 'Z')
function getSelectedDateParam() {
    const dateInput = document.getElementById('reading-date').value;
    return dateInput ? dateInput + ':00Z' : '';
}

// Заполняет выпадающий список глубин на основе последнего загруженного профиля объекта
function populateDepthSelect(data) {
    const select = document.getElementById('depth-select');
    select.innerHTML = '';
    data
        .slice()
        .sort((a, b) => b.depth_m - a.depth_m)
        .forEach(item => {
            const option = document.createElement('option');
            option.value = item.sensor_id;
            option.textContent = `${item.depth_m} м (${item.sensor_id})`;
            select.appendChild(option);
        });
}

// Загружает и рисует тренд (историю измерений) для конкретного датчика
async function loadSensorTrend(sensorId) {
    if (!sensorId) return;

    if (ilChart) {
        ilChart.destroy();
        ilChart = null;
    }
    document.getElementById('chartTitle').innerText = `Датчик: ${sensorId} — загрузка тренда...`;

    try {
        const response = await fetch(`/api/sensor-trend/${sensorId}?limit=50`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Сервер вернул ошибку: ${response.status}`);

        const data = await response.json();

        if (!data || data.length === 0) {
            document.getElementById('chartTitle').innerText = `Датчик: ${sensorId} — нет данных`;
            lastTrendData = [];
            lastTrendSensorId = sensorId;
            return;
        }

        lastTrendData = data;
        lastTrendSensorId = sensorId;
        updateTrendChart(sensorId, data);
        
    } catch (err) {
        console.error('Ошибка при загрузке тренда:', err);
        document.getElementById('chartTitle').innerText = `Датчик: ${sensorId} — ошибка загрузки`;
    }
}

// Рисует график тренда: время по оси X, IL по оси Y
function updateTrendChart(sensorId, data) {
    const ctx = document.getElementById('ilChart').getContext('2d');
    document.getElementById('chartTitle').innerText = `Датчик: ${sensorId} — тренд IL`;

    const labels = data.map(item => {
        const d = new Date(item.timestamp);
        return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    });
    const values = data.map(item => item.il_value);

    if (ilChart) {
        ilChart.destroy();
    }

    ilChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Индекс влажности (IL) во времени',
                data: values,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.15)',
                borderWidth: 2,
                pointRadius: 4,
                tension: 0.2,
                fill: true,
                pointBackgroundColor: values.map(il => {
                    if (il === null) return '#94a3b8';
                    if (il <= 0) return '#22c55e';
                    if (il <= 1) return '#eab308';
                    return '#ef4444';
                })
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    title: { display: true, text: 'Время измерения' },
                    ticks: { maxRotation: 45, minRotation: 45 }
                },
                y: {
                    title: { display: true, text: 'Liquidity Index (IL)' },
                    grid: { color: '#e2e8f0' }
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `IL: ${context.parsed.y !== null ? context.parsed.y.toFixed(4) : 'нет данных'}`;
                        }
                    }
                }
            }
        }
    });
}

// Преобразует массив объектов в CSV-строку
function arrayToCSV(rows, columns) {
    const header = columns.map(c => c.label).join(';');
    const lines = rows.map(row =>
        columns.map(c => {
            const val = row[c.key];
            return (val === null || val === undefined) ? '' : String(val).replace(/;/g, ',');
        }).join(';')
    );
    return [header, ...lines].join('\n');
}

// Скачивает строку как CSV-файл
function downloadCSV(csvString, filename) {
    // \uFEFF — BOM, чтобы Excel корректно определял кодировку UTF-8 и кириллицу
    const blob = new Blob(['\uFEFF' + csvString], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Экспортирует данные текущего отображённого графика (профиль или тренд) в CSV
document.getElementById('exportCsvBtn').addEventListener('click', () => {
    if (chartMode === 'profile') {
        if (!lastProfileData || lastProfileData.length === 0) {
            alert('Нет данных для экспорта. Сначала выберите объект.');
            return;
        }
        const csv = arrayToCSV(lastProfileData, [
            { key: 'sensor_id', label: 'sensor_id' },
            { key: 'depth_m', label: 'depth_m' },
            { key: 'timestamp', label: 'timestamp' },
            { key: 'w_percent', label: 'w_percent' },
            { key: 'wl_value', label: 'wl_value' },
            { key: 'wp_value', label: 'wp_value' },
            { key: 'il_value', label: 'il_value' }
        ]);
        const objId = currentSelectedObjectId || 'object';
        downloadCSV(csv, `profile_object_${objId}.csv`);
    } else {
        if (!lastTrendData || lastTrendData.length === 0) {
            alert('Нет данных для экспорта. Сначала выберите глубину датчика в режиме "Тренд".');
            return;
        }
        const csv = arrayToCSV(lastTrendData, [
            { key: 'timestamp', label: 'timestamp' },
            { key: 'w_percent', label: 'w_percent' },
            { key: 'wl_value', label: 'wl_value' },
            { key: 'wp_value', label: 'wp_value' },
            { key: 'il_value', label: 'il_value' }
        ]);
        const sensorId = lastTrendSensorId || 'sensor';
        downloadCSV(csv, `trend_sensor_${sensorId}.csv`);
    }
});

// Переключение между режимами "Профиль" и "Тренд"
document.getElementById('modeProfileBtn').addEventListener('click', () => {
    chartMode = 'profile';
    document.getElementById('modeProfileBtn').classList.replace('bg-gray-200', 'bg-blue-600');
    document.getElementById('modeProfileBtn').classList.replace('text-gray-700', 'text-white');
    document.getElementById('modeTrendBtn').classList.replace('bg-blue-600', 'bg-gray-200');
    document.getElementById('modeTrendBtn').classList.replace('text-white', 'text-gray-700');
    document.getElementById('depthSelectWrapper').style.display = 'none';

    if (currentSelectedObjectId) {
        loadSensorDataForObject(currentSelectedObjectId);
    }
});

document.getElementById('modeTrendBtn').addEventListener('click', () => {
    chartMode = 'trend';
    document.getElementById('modeTrendBtn').classList.replace('bg-gray-200', 'bg-blue-600');
    document.getElementById('modeTrendBtn').classList.replace('text-gray-700', 'text-white');
    document.getElementById('modeProfileBtn').classList.replace('bg-blue-600', 'bg-gray-200');
    document.getElementById('modeProfileBtn').classList.replace('text-white', 'text-gray-700');
    document.getElementById('depthSelectWrapper').style.display = 'block';

    if (lastProfileData.length > 0) {
        populateDepthSelect(lastProfileData);
        const firstSensorId = document.getElementById('depth-select').value;
        loadSensorTrend(firstSensorId);
    } else if (currentSelectedObjectId) {
        alert('Сначала выберите объект и дату с доступными данными, чтобы получить список датчиков');
    }
});

document.getElementById('depth-select').addEventListener('change', function() {
    loadSensorTrend(this.value);
});

// Слушаем событие изменения даты в календаре
document.getElementById('reading-date').addEventListener('change', function() {
    // Если объект на карте уже был выбран, при смене даты сразу пересчитываем график
    if (currentSelectedObjectId) {
        loadSensorDataForObject(currentSelectedObjectId);
    }
});

// Слушаем нажатие на кнопку "Ок"
document.getElementById('apply-date-btn').addEventListener('click', function() {
    if (currentSelectedObjectId) {
        loadSensorDataForObject(currentSelectedObjectId);
    }
    // Перекрашиваем точки на карте и обновляем активные слои интерполяции под новую дату
    loadObjects(getSelectedDateParam());
    refreshInterpolationLayers();
});
</script>

// 2. Функция для создания слоя интерполяции (Kriging)
function createIDWLayer(data, map) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const size = map.getSize();
    
    // Оптимальное разрешение для баланса скорости и красоты
    const scale = 4; 
    canvas.width = size.x / scale;
    canvas.height = size.y / scale;

    // Сначала заливаем весь холст дефолтным ЗЕЛЕНЫМ
    ctx.fillStyle = "rgba(34, 197, 94, 0.4)"; // Тот самый зеленый
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const points = data.map(p => {
        const cp = map.latLngToContainerPoint([p[0], p[1]]);
        return [cp.x / scale, cp.y / scale, p[2]];
    });

    // Если точек меньше 3 — кригинг обучить нельзя, показываем только фон
    if (points.length < 3) {
        const bounds = map.getBounds();
        return L.imageOverlay(canvas.toDataURL(), bounds, {
            opacity: 0.8, interactive: false, zIndex: 5
        });
    }

    // Обучаем модель кригинга на значениях объектов
    const t = points.map(p => p[2]); // Целевая переменная (avg_il)
    const xArr = points.map(p => p[0]);
    const yArr = points.map(p => p[1]);
    const model = "exponential"; // варианты: "gaussian", "exponential", "spherical"
    const sigma2 = 0;
    const alpha = 100;
    const variogram = kriging.train(t, xArr, yArr, model, sigma2, alpha);

    // Переводим желаемый радиус ореола из МЕТРОВ в пиксели canvas
    // на основе текущего зума карты, чтобы размер пятна на местности
    // не менялся при приближении/отдалении
    const RADIUS_METERS = 300; // радиус зоны влияния датчика, метры — подбери под свою карту
    const EDGE_METERS = 350;   // расстояние, на котором ореол полностью затухает

    const centerLat = map.getCenter().lat;
    const metersPerPixel = 156543.03392 * Math.cos(centerLat * Math.PI / 180) / Math.pow(2, map.getZoom());

    const cutoffPx = (RADIUS_METERS / metersPerPixel) / scale;
    const edgePx = (EDGE_METERS / metersPerPixel) / scale;

    // Проходим по пикселям
    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
            let closestDist = Infinity;

            for (let i = 0; i < points.length; i++) {
                const dx = x - points[i][0];
                const dy = y - points[i][1];
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < closestDist) closestDist = d;
            }

            // ПРОВЕРКА ДИСТАНЦИИ (теперь в реальных метрах, а не в пикселях):
            // Если до ближайшего датчика больше заданного радиуса,
            // оставляем пиксель зеленым и идем дальше.
            if (closestDist > cutoffPx) continue; 

            // Предсказание значения кригингом в этой точке
            const val = kriging.predict(x, y, variogram);

            // Вычисляем прозрачность в зависимости от расстояния (чтобы края пятен были мягкими)
            let edgeAlpha = 1 - (closestDist / edgePx);
            if (edgeAlpha < 0) edgeAlpha = 0;

            // Определяем цвет пятна вокруг датчика
            let color;
            if (val <= 0.5) continue; // Если значение и так низкое, пусть остается зеленый фон
            else if (val <= 1.0) color = `rgba(234, 179, 8, ${0.5 * edgeAlpha})`; // Желтый ореол
            else color = `rgba(239, 68, 68, ${0.6 * edgeAlpha})`; // Красный ореол

            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
        }
    }

    const bounds = map.getBounds();
    return L.imageOverlay(canvas.toDataURL(), bounds, {
        opacity: 0.8,
        interactive: false,
        zIndex: 5
    });
}

        map.once('moveend', () => {

// Функция отрисовки слоя W (Влажность)
function createWLayer(data, map) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const size = map.getSize();
    const scale = 2; 
    canvas.width = size.x / scale;
    canvas.height = size.y / scale;

    // 1. Устанавливаем СВЕТЛО-ЖЕЛТЫЙ фон
    // rgba(254, 249, 195, 0.5) — это мягкий кремово-желтый
    ctx.fillStyle = "rgba(254, 249, 195, 0.5)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const points = data.map(p => {
        const cp = map.latLngToContainerPoint([p[0], p[1]]);
        return [cp.x / scale, cp.y / scale, p[2]];
    });

    // Переводим желаемый радиус ореола из МЕТРОВ в пиксели canvas
    // на основе текущего зума карты, чтобы размер пятна на местности
    // не менялся при приближении/отдалении
    const RADIUS_METERS = 300; // подбери под свою карту, как и для IL-слоя
    const centerLat = map.getCenter().lat;
    const metersPerPixel = 156543.03392 * Math.cos(centerLat * Math.PI / 180) / Math.pow(2, map.getZoom());
    const radius = (RADIUS_METERS / metersPerPixel) / scale;

    points.forEach(p => {
        const x = p[0];
        const y = p[1];
        const val = p[2];

        // 2. НАСЫЩЕННАЯ ГРАДАЦИЯ КРАСНОГО
        let color;
        if (val < 20) {
            color = "239, 68, 68";   // Ярко-красный (Red 500)
        } else if (val < 30) {
            color = "185, 28, 28";   // Насыщенный темно-красный (Red 700)
        } else {
            color = "127, 29, 29";   // Глубокий бордовый (Red 900)
        }

        // 3. СОЗДАЕМ ГРАДИЕНТ
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        
        // Сделали центр более плотным (0.9), чтобы цвет был насыщеннее
        gradient.addColorStop(0, `rgba(${color}, 0.9)`); 
        gradient.addColorStop(0.4, `rgba(${color}, 0.5)`); 
        gradient.addColorStop(1, `rgba(${color}, 0)`); 

        ctx.fillStyle = gradient;
        
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    });

    const bounds = map.getBounds();
    return L.imageOverlay(canvas.toDataURL(), bounds, {
        opacity: 1, 
        interactive: false,
        zIndex: 5
    });
}

</script>
