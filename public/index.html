        <script>
function openLoginModal() {
    document.getElementById('login-modal').style.display = 'flex';
}

function closeLoginModal() {
    document.getElementById('login-modal').style.display = 'none';
    document.getElementById('login-error').innerText = '';
}

async function login() {
    const username = document.getElementById('username-input').value.trim();
    const password = document.getElementById('password-input').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            localStorage.setItem('currentUser', JSON.stringify({ username: data.username, role: data.role }));
            applyRolePermissions(data.role, data.username);
            closeLoginModal();
        } else {
            document.getElementById('login-error').innerText = data.message;
        }
    } catch (err) {
        console.error('Ошибка входа:', err);
        document.getElementById('login-error').innerText = 'Ошибка соединения с сервером';
    }
}

function logout() {
    localStorage.removeItem('currentUser');
    location.reload(); 
}

function applyRolePermissions(role, username) {
    document.getElementById('login-btn').style.display = 'none';
    
    const userInfo = document.getElementById('user-info');
    userInfo.style.display = 'inline-block';
    userInfo.innerText = `${username} (${role})`;
    
    document.getElementById('logout-btn').style.display = 'inline-block';

    // ВАЖНО: Принудительно делаем дашборд видимым
    const dashboard = document.getElementById('main-dashboard');
    if (dashboard) {
        dashboard.style.display = 'block';
    }

    // Исправление для корректной отрисовки карты Leaflet
    setTimeout(() => {
        if (typeof map !== 'undefined') {
            map.invalidateSize();
        }
    }, 200);

    if (role === 'user') {
        console.log('Режим просмотра (user)');
    } else if (role === 'engineer') {
        console.log('Режим инженера');
    } else if (role === 'admin') {
        console.log('Режим администратора');
    }
}

// Автопроверка сессии при перезагрузке страницы, если пользователь уже залогинен
window.addEventListener('DOMContentLoaded', () => {
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        const user = JSON.parse(savedUser);
        applyRolePermissions(user.role, user.username);
    }
});

    <script>
 // 1. Объявляем переменные ГЛОБАЛЬНО в самом верху
// 1. Объявляем переменные в самом верху
let interpolationLayer = null;

// 2. Функция для создания слоя интерполяции (IDW)
function createIDWLayer(data, map) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const size = map.getSize();
    
    // Оптимальное разрешение для баланса скорости и красоты
    const scale = 4; 
    canvas.width = size.x / scale;
    canvas.height = size.y / scale;

    // Сначала заливаем весь холст дефолтным ЗЕЛЕНЫМ
    ctx.fillStyle = "rgba(34, 197, 94, 0.4)"; // Тот самый зеленый
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const points = data.map(p => {
        const cp = map.latLngToContainerPoint([p[0], p[1]]);
        return [cp.x / scale, cp.y / scale, p[2]];
    });

    // Проходим по пикселям
    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
            let num = 0, den = 0;
            let closestDist = Infinity;

            for (let i = 0; i < points.length; i++) {
                const dx = x - points[i][0];
                const dy = y - points[i][1];
                const d = Math.sqrt(dx * dx + dy * dy);
                
                if (d < closestDist) closestDist = d;

                // Математика интерполяции
                const weight = 1 / Math.pow(d, 3); // Степень 3 вместо 2 делает ореолы вокруг точек компактнее
                num += points[i][2] * weight;
                den += weight;
            }

            // ПРОВЕРКА ДИСТАНЦИИ: 
            // Если до ближайшего датчика больше 50 пикселей (на мини-холсте), 
            // оставляем пиксель зеленым и идем дальше.
            if (closestDist > 40) continue; 

            const val = num / den;

            // Вычисляем прозрачность в зависимости от расстояния (чтобы края пятен были мягкими)
            // Чем дальше от датчика, тем сильнее просвечивает зеленый фон
            let edgeAlpha = 1 - (closestDist / 50);
            if (edgeAlpha < 0) edgeAlpha = 0;

            // Определяем цвет пятна вокруг датчика
            let color;
            if (val <= 0.5) continue; // Если значение и так низкое, пусть остается зеленый фон
            else if (val <= 1.0) color = `rgba(234, 179, 8, ${0.5 * edgeAlpha})`; // Желтый ореол
            else color = `rgba(239, 68, 68, ${0.6 * edgeAlpha})`; // Красный ореол

            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
        }
    }

    const bounds = map.getBounds();
    return L.imageOverlay(canvas.toDataURL(), bounds, {
        opacity: 0.8,
        interactive: false,
        zIndex: 5
    });
}

// 3. Обработчик кнопки
document.getElementById('toggleKriging').addEventListener('click', async function() {
    if (interpolationLayer) {
        map.removeLayer(interpolationLayer);
        interpolationLayer = null;
        this.innerText = "Average IL";
        return;
    }

    try {
        const response = await fetch('/api/objects');
        const objects = await response.json();
        
        const idwData = objects
            .filter(o => o.avg_il !== null)
            .map(o => [parseFloat(o.lat), parseFloat(o.lng), parseFloat(o.avg_il)]);

        if (idwData.length === 0) return alert("Нет данных");

        // Создаем и добавляем слой
        interpolationLayer = createIDWLayer(idwData, map);
        interpolationLayer.addTo(map);

        this.innerText = "Hide IL Map";

        // Перерисовывать при сдвиге карты, чтобы охват всегда был на весь экран
        map.once('moveend', () => {
            if (interpolationLayer) {
                map.removeLayer(interpolationLayer);
                interpolationLayer = createIDWLayer(idwData, map);
                interpolationLayer.addTo(map);
            }
        });

    } catch (err) {
        console.error(err);
    }
});
</script>

<script>

let wLayer = null; // Глобальная переменная для слоя W

document.getElementById('toggleWMap').addEventListener('click', async function() {
    if (wLayer) {
        map.removeLayer(wLayer);
        wLayer = null;
        this.innerText = "Average W";
        this.classList.replace('bg-red-600', 'bg-teal-500');
        return;
    }

    // Если включен слой IL, выключаем его, чтобы не накладывались
    if (interpolationLayer) document.getElementById('toggleKriging').click();

    try {
        const response = await fetch('/api/objects');
        const objects = await response.json();
        
        // Берем данные avg_w (влажность)
        const wData = objects
            .filter(o => o.avg_w !== null)
            .map(o => [parseFloat(o.lat), parseFloat(o.lng), parseFloat(o.avg_w)]);

        if (wData.length === 0) return alert("Нет данных по влажности");

        // Создаем слой W
        wLayer = createWLayer(wData, map);
        wLayer.addTo(map);

        this.innerText = "Hide W Map";
        this.classList.replace('bg-teal-500', 'bg-red-600');

    } catch (err) {
        console.error(err);
    }
});

// Функция отрисовки слоя W (Влажность)
function createWLayer(data, map) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const size = map.getSize();
    const scale = 2; 
    canvas.width = size.x / scale;
    canvas.height = size.y / scale;

    // 1. Устанавливаем СВЕТЛО-ЖЕЛТЫЙ фон
    // rgba(254, 249, 195, 0.5) — это мягкий кремово-желтый
    ctx.fillStyle = "rgba(254, 249, 195, 0.5)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const points = data.map(p => {
        const cp = map.latLngToContainerPoint([p[0], p[1]]);
        return [cp.x / scale, cp.y / scale, p[2]];
    });

    const radius = 45; // Чуть увеличили радиус для лучшего слияния

    points.forEach(p => {
        const x = p[0];
        const y = p[1];
        const val = p[2];

        // 2. НАСЫЩЕННАЯ ГРАДАЦИЯ КРАСНОГО
        let color;
        if (val < 20) {
            color = "239, 68, 68";   // Ярко-красный (Red 500)
        } else if (val < 30) {
            color = "185, 28, 28";   // Насыщенный темно-красный (Red 700)
        } else {
            color = "127, 29, 29";   // Глубокий бордовый (Red 900)
        }

        // 3. СОЗДАЕМ ГРАДИЕНТ
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        
        // Сделали центр более плотным (0.9), чтобы цвет был насыщеннее
        gradient.addColorStop(0, `rgba(${color}, 0.9)`); 
        gradient.addColorStop(0.4, `rgba(${color}, 0.5)`); 
        gradient.addColorStop(1, `rgba(${color}, 0)`); 

        ctx.fillStyle = gradient;
        
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    });

    const bounds = map.getBounds();
    return L.imageOverlay(canvas.toDataURL(), bounds, {
        opacity: 1, 
        interactive: false,
        zIndex: 5
    });
}

</script>


    <script>
        // --- 1. Инициализация карты ---
        const map = L.map('map').setView([51.1228, 71.4271], 13); // Центр на Астану
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let ilChart; // Переменная для хранения экземпляра графика

        // --- 2. Функция отрисовки графика ---
        function updateChart(objectId, data) {
            const ctx = document.getElementById('ilChart').getContext('2d');
            document.getElementById('chartTitle').innerText = `Объект: ${objectId}`;
            
// Сортируем данные по глубине для правильного отображения линии
data.sort((a, b) => b.depth_m - a.depth_m);

            // Подготовка данных: X - это IL, Y - это глубина
            const points = data.map(item => ({
                x: item.il_value, 
                y: item.depth_m
            }));

            if (ilChart) {
                ilChart.destroy(); // Удаляем старый график перед созданием нового
            }

            ilChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Индекс влажности (IL)',
                        data: points,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.2)',
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.1, // Сглаживание линии
                        showLine: true,

                // Динамический цвет точек (заливка)
                pointBackgroundColor: data.map(item => {
                    const il = item.il_value;
                    if (il <= 0) return '#22c55e';      // Зеленый 
                    if (il > 0 && il <= 1) return '#eab308'; // Желтый 
                    return '#ef4444';                   // Красный 
                }),
                // Динамический цвет границ точек
                pointBorderColor: data.map(item => {
                    const il = item.il_value;
                    if (il <= 0) return '#166534';
                    if (il > 0 && il <= 1) return '#854d0e';
                    return '#991b1b';
                }),
                pointRadius: 5,
                pointHoverRadius: 7

                }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: -1,
                            max: 2,
                            title: { display: true, text: 'Liquidity Index (IL)' },
                            grid: { color: '#e2e8f0' }
                        },
                        y: {
                            type: 'linear',
                            min: -25,
                            max: 0,
                            title: { display: true, text: 'Глубина (м)' },
                            grid: { color: '#e2e8f0' }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `IL: ${context.parsed.x.toFixed(4)}, Глубина: ${context.parsed.y}м`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- 3. Загрузка объектов на карту ---
        async function loadObjects() {
    try {
        const response = await fetch('/api/objects');
        const objects = await response.json();

        objects.forEach(obj => {
            // 1. Определяем цвет точки на основе среднего IL
            let statusColor = "#94a3b8"; // По умолчанию серый
            const avg = obj.avg_il;
            
            if (avg !== null) {
                if (avg <= 0) statusColor = "#22c55e";      // Зеленый
                else if (avg <= 1) statusColor = "#eab308"; // Желтый
                else statusColor = "#ef4444";               // Красный
            }

            // 2. Создаем круглый маркер вместо пина
            const marker = L.circleMarker([obj.lat, obj.lng], {
                radius: 10,           // Размер точки
                fillColor: statusColor,
                color: "#ffffff",      // Цвет обводки
                weight: 2,            // Толщина обводки
                opacity: 1,
                fillOpacity: 0.9      // Прозрачность заливки
            }).addTo(map);

            // 3. Подготовка текста для Popup
            const avgILValue = obj.avg_il;
    const avgWValue = obj.avg_w; // Берем значение влажности

    const displayIL = (avgILValue !== null) ? avgILValue : "нет данных";
    const displayW = (avgWValue !== null) ? avgWValue + "%" : "нет данных";

    let statusText = "";
    if (avgILValue !== null) {
        if (avgILValue <= 0) statusText = "(Normal)";
        else if (avgILValue <= 1) statusText = "(Risk)";
        else statusText = "(Waterlogging)";
    }

    // Обновленный шаблон Popup
    marker.bindPopup(`
        <div style="text-align: center; font-family: sans-serif;">
            <b style="font-size: 14px;">Объект: ${obj.object_id}</b><br>
            <hr style="margin: 5px 0;">
            <div style="text-align: left; font-size: 12px;">
                Глубина расчета (N): ${obj.n_levels}<br>
                <b>Средний IL:</b> ${displayIL} <br>
                <b>Средний W:</b> <span>${displayW}</span>
            </div>
            <hr style="margin: 5px 0;">
            <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
        </div>
    `);

    // 4. Клик на точку для обновления графика
    marker.on('click', async () => {
        console.log("Клик по объекту:", obj.object_id);
        const res = await fetch(`/api/object-details/${obj.object_id}`);
        const details = await res.json();
        updateChart(obj.object_id, details);
    });
});

    } catch (err) {
        console.error("Ошибка загрузки объектов:", err);
    }
}
        

        loadObjects();
